name: generate snake animation

on:
  # 每 12 小时自动跑一次
  schedule:
    - cron: "0 */12 * * *"
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: generate snake svg into images/
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            images/github-snake.svg
            images/github-snake-dark.svg?palette=github-dark&color_snake=#5eead4

      - name: commit updated snake svg to main
        run: |
          if git diff --quiet -- images/github-snake.svg images/github-snake-dark.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/github-snake.svg images/github-snake-dark.svg
          git commit -m "chore: update contribution snake [skip ci]"
          git push origin HEAD:main
