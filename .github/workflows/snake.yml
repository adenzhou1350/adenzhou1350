name: generate snake animation

on:
  # 每 12 小时自动跑一次
  schedule:
    - cron: "0 */12 * * *"
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: generate snake svg into images/
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            images/github-snake.svg
            images/github-snake-dark.svg?palette=github-dark&color_snake=#5eead4

      - name: commit updated snake svg to main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution snake [skip ci]"
          file_pattern: images/github-snake.svg images/github-snake-dark.svg
